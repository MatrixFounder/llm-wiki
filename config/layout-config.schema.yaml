$schema: 'https://json-schema.org/draft/2020-12/schema'
$id: 'https://github.com/sergey/obsidian-llm-wiki/config/layout-config.schema.yaml'
title: 'layout-config'
description: >
  JSON Schema 2020-12 for a wiki LAYOUT GRAMMAR (TASK 012 / R-X1, PW-A). This is
  the per-layout-class parsing grammar — a SEPARATE config system from the
  per-vault identity config (config/wiki-config.schema.yaml). Built-in layouts
  ship at scripts/wiki_index/layouts/{karpathy,dev-project,obsidian-personal}.yaml;
  an operator may override per-vault via <vault>/.wiki/layout.yaml or a
  WIKI_SCHEMA.md frontmatter `layout_config:` pointer.

  Validate a merged layout config against #/$defs/LayoutConfig. Unlike
  wiki-config.schema.yaml (additionalProperties: true, forward-compat stub),
  PathEntry / RefRule / TypeMappingEntry are STRICT (additionalProperties: false)
  so a misspelled grammar key is a load-time error (exit 6), not a silent
  _unmatched_ flood (D-012-2 / architecture-review).

  PER-VAULT OVERRIDE MERGE SEMANTICS (TASK 025 / R-7 — a sharp edge): when a
  <vault>/.wiki/layout.yaml supplies a key, scalars overlay; `ignore` UNIONs the
  built-in list and `type_mapping` deep-MERGES; but `paths` and `ref_extraction`
  REPLACE the entire built-in list (Q-012-f — supplying the key also flags the
  override as operator-supplied for the ReDoS engine). To EXTEND/deepen paths you
  must re-declare the base layout's paths verbatim plus your new rule — a bare
  one-rule `paths:` override silently discards all built-in routing.

$defs:
  # ----------------------------------------------------------------------------
  # SlugStrategy — how a page slug is derived (PW-L). `identity` = verbatim stem
  # (Karpathy byte-identity); the others call python-slugify (obsidian-personal).
  # ----------------------------------------------------------------------------
  SlugStrategy:
    type: string
    enum: [identity, preserve-unicode, transliterate, ascii-only]

  # `course-slug` is the loose-default slugify used for the Karpathy course
  # project (slugify(name, lowercase=True, separator='-')) — distinct from the
  # page slug_strategy and from the strict concept-tag _slugify_concept.
  ProjectSlugStrategy:
    type: string
    enum: [course-slug, identity, preserve-unicode, transliterate, ascii-only]

  # ----------------------------------------------------------------------------
  # PathEntry — one glob → (type, project) rule. STRICT.
  # ----------------------------------------------------------------------------
  PathEntry:
    type: object
    additionalProperties: false
    required: [glob]
    properties:
      glob:
        type: string
        description: 'vault-root-relative glob (native ** supported via Path.glob).'
      type:
        type: [string, 'null']
        description: >
          Literal raw-type for matched files (e.g. task, adr). If absent, the
          engine infers from frontmatter `type:` then path_type_fallback.
      project:
        type: [string, 'null']
        description: 'Literal pages.project value (e.g. _vault_).'
      project_pattern:
        type: [string, 'null']
        description: 'Regex matched against the vault-relative POSIX path; named groups feed project_template.'
      project_template:
        type: [string, 'null']
        description: 'string.Template (${name} only) over project_pattern named groups.'
      project_slug_strategy:
        oneOf:
          - {$ref: '#/$defs/ProjectSlugStrategy'}
          - {type: 'null'}
      default_tags:
        type: array
        items: {type: string}
        default: []
      extra_tags:
        type: array
        items: {type: string}
        default: []

  # ----------------------------------------------------------------------------
  # RefRule — one cross-reference extraction pattern (PW-D). STRICT.
  # ----------------------------------------------------------------------------
  RefRule:
    type: object
    additionalProperties: false
    required: [kind, regex, target_group]
    properties:
      kind:
        type: string
        enum: [wiki-link, markdown-link, id-ref]
      regex:
        type: string
      target_group:
        type: integer
        minimum: 0
      transform:
        type: [string, 'null']
        enum: [stem, null]
        description: 'Optional post-match transform (stem = basename without extension).'

  # ----------------------------------------------------------------------------
  # TypeMappingEntry — raw_type → (db_type, tag). db_type MUST be a live
  # pages.type CHECK enum value. STRICT.
  # ----------------------------------------------------------------------------
  TypeMappingEntry:
    type: object
    additionalProperties: false
    required: [db_type]
    properties:
      db_type:
        type: string
        enum: [summary, concept, query, brief, research, index, verification]
      tag:
        type: [string, 'null']

  # ----------------------------------------------------------------------------
  # FrontmatterSynthesis (PW-F).
  # ----------------------------------------------------------------------------
  FrontmatterSynthesis:
    type: object
    additionalProperties: false
    properties:
      enabled: {type: boolean, default: false}
      title_source: {type: string, enum: [first_h1], default: first_h1}
      fallback_title: {type: string, enum: [filename_stem], default: filename_stem}

  # ----------------------------------------------------------------------------
  # AutoIndex (PW-H) — a rebuildable-markdown projection target.
  # ----------------------------------------------------------------------------
  AutoIndex:
    type: object
    additionalProperties: false
    required: [source_type, output]
    properties:
      source_type: {type: string}
      output: {type: string}
      group_by: {type: [string, 'null']}
      sort_within_group:
        type: array
        items: {type: string}
        default: []

  # ----------------------------------------------------------------------------
  # DriftRule (TASK 036 / R-15, Slice A1) — one lifecycle-drift rule: a page of
  # `class` (frontmatter $.type) carrying the typed `edge` (a STORED ref_type the
  # page itself holds — the auto-derived inverse, e.g. superseded-by) whose AUTHORED
  # `status` contradicts that. STRICT. `oneOf` enforces exactly one of expect_status
  # / forbid_status. The `edge` vocabulary + structure are re-checked in Python
  # (layout_config._validate_health_rules) against reindex._INVERSE_REF_TYPE.
  # ----------------------------------------------------------------------------
  DriftRule:
    type: object
    additionalProperties: false
    required: [class, edge]
    properties:
      class: {type: string, description: 'frontmatter $.type this rule applies to'}
      edge:
        type: string
        description: 'stored ref_type carried by the page (auto-derived inverse, e.g. superseded-by)'
      expect_status:
        type: string
        description: 'drift when status is PRESENT and != this value (NULL status is never drift)'
      forbid_status:
        type: array
        items: {type: string}
        minItems: 1
        description: 'drift when status is one of these values'
    oneOf:
      - {required: [expect_status]}
      - {required: [forbid_status]}

  # ----------------------------------------------------------------------------
  # CoverageRule (TASK 036 / R-15, Slice A2) — one coverage-gap rule: a page of
  # `class` MISSING an expected relation. STRICT. `oneOf` enforces exactly one of
  # requires_edge / requires_field.
  #
  # TASK 072 / P2 — `forbid_values` WIDENS what `requires_field` means: the gap
  # condition becomes *absent/empty* OR *value ∈ forbid_values* ("present, and a
  # non-answer"). It is an OPTIONAL MODIFIER of requires_field, never a third
  # branch — `dependentRequired` binds it, and that binding is airtight ONLY
  # because the block uses `oneOf` (under `anyOf`, `requires_edge` +
  # `requires_field` + `forbid_values` would validate). Absent key ⇒ the emitted
  # SQL and every envelope are byte-identical to pre-072 (off-equivalence golden:
  # tests/test_coverage_forbid_values.py).
  #
  # The sentinel STRINGS are an authoring convention and stay OUT of every
  # built-in layout — they belong in <vault>/.wiki/layout.yaml. Mechanically
  # enforced (test_no_builtin_layout_ships_forbid_values), not review-gated.
  # ----------------------------------------------------------------------------
  CoverageRule:
    type: object
    additionalProperties: false
    required: [class]
    properties:
      class: {type: string}
      requires_edge:
        type: string
        description: 'gap when the page has NO typed edge of this ref_type (e.g. implemented-by)'
      requires_field:
        type: string
        description: >
          gap when frontmatter scalar $.<field> is absent/empty (allow-listed name) —
          OR, when forbid_values is also set, when its value is one of those sentinels
      forbid_values:
        type: array
        items: {type: string}
        minItems: 1
        description: >
          extra gap condition for requires_field: the scalar is PRESENT but carries a
          value meaning "no answer" (e.g. verified_on: "not verified"). An empty list is
          a dead rule → rejected here; a blank member is rejected in _validate_health_rules
    oneOf:
      - {required: [requires_edge]}
      - {required: [requires_field]}
    dependentRequired:
      forbid_values: [requires_field]

  # ----------------------------------------------------------------------------
  # Ontology (TASK 054 / R-19) — the OPTIONAL declared type/edge/property contract.
  # STRICT. `closed_types` asserts the type roster IS the type_mapping keys; `edges`
  # declares per-ref_type domain/range; `properties` declares per-class value enums.
  # The `edge` vocabulary + all `from`/`to`/`class` names + property `field` names are
  # re-checked in Python (layout_config._validate_ontology) against
  # reindex._INVERSE_REF_TYPE + type_mapping keys + validate_filter_field.
  # ----------------------------------------------------------------------------
  OntologyEdge:
    type: object
    additionalProperties: false
    required: [edge, from, to]
    properties:
      edge:
        type: string
        description: 'the (forward) ref_type this rule constrains (e.g. implements)'
      from:
        type: array
        items: {type: string}
        minItems: 1
        description: 'allowed SOURCE page classes (frontmatter $.type) — the domain'
      to:
        type: array
        items: {type: string}
        minItems: 1
        description: 'allowed TARGET page classes — the range'

  OntologyProperty:
    type: object
    additionalProperties: false
    required: [class, field, enum]
    properties:
      class: {type: string, description: 'frontmatter $.type this rule applies to'}
      field:
        type: string
        description: 'frontmatter scalar field whose value is constrained (allow-listed name)'
      enum:
        type: array
        items: {type: string}
        minItems: 1
        description: 'the permitted values; a PRESENT scalar not in this set is a violation'

  Ontology:
    type: object
    additionalProperties: false
    properties:
      closed_types:
        type: boolean
        default: false
        description: 'flag a page whose authored $.type scalar is outside the type_mapping roster'
      edges:
        type: array
        items: {$ref: '#/$defs/OntologyEdge'}
        default: []
        description: 'per-ref_type domain/range declarations'
      properties:
        type: array
        items: {$ref: '#/$defs/OntologyProperty'}
        default: []
        description: 'per-class property value-enum declarations'

  # ----------------------------------------------------------------------------
  # WriteGrammar (TASK 040 / ADR-007) — the WRITE-side grammar: where a NEW source
  # note + its concept pages file, and the source filename convention. Optional;
  # absent → the engine default (PARA-legacy: "" / title). Makes Karpathy a YAML, not a fork.
  # ----------------------------------------------------------------------------
  WriteGrammar:
    type: object
    additionalProperties: false
    properties:
      source_subdir:
        type: string
        pattern: '^([^/\\.][^/\\]*)?$'   # "" or ONE safe segment (no '/' '\\' '..' leading-dot)
        description: 'subdir a source note nests in ("_sources" for karpathy); "" = file in the target folder'
        default: ''
      source_filename:
        type: string
        enum: [slug, title]
        description: 'slug = filename==page-slug (karpathy identity); title = human-readable (PARA)'
        default: title

  # ----------------------------------------------------------------------------
  # LayoutConfig — the merged grammar the engine consumes.
  # ----------------------------------------------------------------------------
  LayoutConfig:
    type: object
    additionalProperties: false
    required: [schema_version, layout, slug_strategy, paths, type_mapping]
    properties:
      schema_version: {type: string}
      layout: {type: string}
      ignore:
        type: array
        items: {type: string}
        default: []
      file_extensions:
        type: array
        items: {type: string}
        default: ['.md']
      slug_strategy: {$ref: '#/$defs/SlugStrategy'}
      write: {$ref: '#/$defs/WriteGrammar'}
      import_images:
        type: boolean
        default: true
        description: >-
          wiki-import: download images of an imported source into its
          `_raw/_attachments/` (self-contained capture). false → keep remote URLs.
      paths:
        type: array
        minItems: 1
        items: {$ref: '#/$defs/PathEntry'}
      type_mapping:
        type: object
        additionalProperties: {$ref: '#/$defs/TypeMappingEntry'}
      path_type_fallback:
        type: object
        additionalProperties: {type: string}
        default: {}
      ref_extraction:
        type: array
        items: {$ref: '#/$defs/RefRule'}
        default: []
      frontmatter_synthesis:
        $ref: '#/$defs/FrontmatterSynthesis'
      auto_indexes:
        type: array
        items: {$ref: '#/$defs/AutoIndex'}
        default: []
      # TASK 036 / R-15 — derived knowledge-health rules (zero DDL; computed over
      # pages.frontmatter_json + page_entity_refs). Both OPTIONAL with [] defaults so
      # every pre-036 layout YAML keeps validating; an operator override REPLACES the
      # list wholesale (same merge semantics as paths/ref_extraction).
      drift_rules:
        type: array
        items: {$ref: '#/$defs/DriftRule'}
        default: []
        description: 'lifecycle-drift rules (Slice A1, surfaced by wiki-lint).'
      coverage_rules:
        type: array
        items: {$ref: '#/$defs/CoverageRule'}
        default: []
        description: 'coverage-gap rules (Slice A2, surfaced by wiki-health coverage).'
      # TASK 054 / R-19 — OPTIONAL formal ontology contract (zero DDL; computed over the
      # same pages.frontmatter_json + page_entity_refs). Absent ⇒ ontology is None ⇒ zero
      # behaviour change (cybos ships one; other layouts ship none). A per-vault override
      # deep-merges: `closed_types` is a scalar overwrite, but `edges`/`properties` REPLACE
      # as whole lists (an override that supplies `edges:` discards the base edges) — the
      # same list-replace semantics as paths/ref_extraction/drift_rules.
      # formal ontology contract (R-19, surfaced by wiki-lint + wiki-health ontology).
      ontology: {$ref: '#/$defs/Ontology'}
      # TASK 031 / R-031-3 — INIT-ONLY registry metadata (the layout registry
      # reads these RAW; the indexer ignores them, so they do NOT affect
      # discovery/pages/refs → Karpathy byte-identity holds). Both OPTIONAL with
      # safe defaults so every pre-031 layout YAML keeps validating.
      aliases:
        type: array
        items: {type: string}
        default: []
        description: >
          Alternative `--layout` / WIKI_SCHEMA `layout:` names that resolve to
          this built-in grammar (e.g. karpathy declares [flat, per-project]).
          Consumed by layout_choices() / resolve_alias(); ignored by the indexer.
      init_scaffold:
        type: string
        enum: [two-tier, none]
        default: none
        description: >
          Whether `wiki-init --scaffold-new` creates the two-tier Karpathy
          page-subdir tree (_sources/_concepts/…) and selects the Karpathy agent
          template. `none` (default) = index an existing tree. Drives
          is_two_tier_scaffold(); ignored by the indexer.

# Top-level: library of $defs (mirrors wiki-config.schema.yaml). The loader
# validates a merged config against #/$defs/LayoutConfig explicitly.
type: object
description: 'Library of $defs. Validate against #/$defs/LayoutConfig.'
