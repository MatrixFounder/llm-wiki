$schema: 'https://json-schema.org/draft/2020-12/schema'
$id: 'https://github.com/sergey/obsidian-llm-wiki/config/sync-config.schema.yaml'
title: 'sync-config'
description: >
  JSON Schema 2020-12 for the per-vault `.wiki/sync.yaml` (TASK 018 / R-11). This
  configures `wiki-sync` — the format-aware, tag-routed ingest dispatcher — and is
  a SEPARATE config system from both the per-vault identity config
  (config/wiki-config.schema.yaml) and the per-layout grammar
  (config/layout-config.schema.yaml). The file is OPTIONAL: a vault with no
  `.wiki/sync.yaml` uses the built-in defaults (empty zones/exclude, `wiki`
  namespace, built-in extension routing in scripts/wiki_skills/_sync.py).

  STRICT (additionalProperties: false everywhere) so a misspelled key is a
  load-time error (INVALID_SYNC_CONFIG, exit 6) rather than a silent no-op —
  same posture as layout-config.schema.yaml. The error NEVER echoes the offending
  value (CWE-209/CWE-117). Defense-in-depth against an untrusted config file is
  enforced in the loader (scripts/wiki_index/sync_config.py): a 256 KiB size cap
  before read + a SafeLoader subclass that REFUSES YAML anchors/aliases
  (`yaml.safe_load` alone still EXPANDS aliases → billion-laughs DoS; SEC-N3).

$defs:
  # ----------------------------------------------------------------------------
  # Extensions — optional operator overrides that EXTEND the built-in routing
  # sets (they never shrink them). `convert` → office/PDF convert+ingest; `text`
  # → raw text-source ingest; `skip` → force-skip an extension.
  # ----------------------------------------------------------------------------
  Extensions:
    type: object
    additionalProperties: false
    properties:
      convert:
        type: array
        items: {type: string}
        default: []
      text:
        type: array
        items: {type: string}
        default: []
      skip:
        type: array
        items: {type: string}
        default: []

  # ----------------------------------------------------------------------------
  # SyncConfig — the merged config the dispatcher consumes.
  # ----------------------------------------------------------------------------
  SyncConfig:
    type: object
    additionalProperties: false
    properties:
      zones:
        type: array
        items: {type: string}
        default: []
        description: 'Vault-root-relative globs of sync zones (advisory; `wiki-sync scan <zone>` takes an explicit zone).'
      exclude:
        type: array
        items: {type: string}
        default: []
        description: >
          Vault-root-relative globs pruned from the walk. A NON-`.md` match is
          pruned immediately; a `.md` match is still read so a `#wiki/keep` tag
          can rescue it (precedence pinned in the loader).
      tag_namespace:
        type: string
        default: 'wiki'
        description: 'Routing-tag namespace; `#<ns>/{raw,skip,keep}` + a `<ns>:` frontmatter field.'
      extensions:
        $ref: '#/$defs/Extensions'
      resummarize:
        $ref: '#/$defs/Resummarize'
      transcript_dedup:
        $ref: '#/$defs/TranscriptDedup'

  # ----------------------------------------------------------------------------
  # TranscriptDedup (TASK 023) — transcript FORMAT dedup. OPT-IN: absence ≡ no
  # dedup. Among transcript-format files (suffix in `prefer_ext`) sharing a
  # (parent-dir, identity) group, only the highest-preference format is ingested;
  # lower-preference siblings → `skip:transcript-variant:<kept_ext>`. A lone
  # caption with no higher-preference sibling is KEPT (still ingested).
  # STRICT (additionalProperties:false) — a misspelled key is INVALID_SYNC_CONFIG.
  # ----------------------------------------------------------------------------
  TranscriptDedup:
    type: object
    additionalProperties: false
    properties:
      enabled: {type: boolean}
      prefer_ext:
        type: array
        items: {type: string, pattern: '^\.[A-Za-z0-9.]+$'}
        description: 'Ordered format preference, most-preferred first (default [.txt, .vtt, .srt]).'
      identity:
        type: string
        enum: [stem, before-first-dot]
        description: >
          Variant-grouping key: 'stem' (filename minus last extension — groups a
          .vtt with its same-stem .txt) or 'before-first-dot' (filename up to the
          first '.', for YouTube-id captions like ID.ru.txt / ID.ru-orig.vtt).

  # ----------------------------------------------------------------------------
  # Resummarize (TASK 019) — the re-summarization policy gate. OPT-IN: absence ≡
  # TASK 018 behavior. A raw source (ingest / convert+ingest) is gated to
  # `skip:summary-exists:*` unless `--force` or `mode: always`. "Summary exists"
  # = union of D1 (source_state) ∪ D2a (provenance_ref) ∪ D2b (mirror). Per-folder
  # overridable via `<folder>/.wiki/sync.yaml` (Option A cascade, deepest-wins).
  # STRICT (additionalProperties:false) — a misspelled key is INVALID_SYNC_CONFIG.
  # ----------------------------------------------------------------------------
  Resummarize:
    type: object
    additionalProperties: false
    properties:
      mode:
        type: string
        enum: [if-missing, always, never]
        description: 'if-missing (default): ingest only if no summary detected; always; never.'
      detect:
        $ref: '#/$defs/Detect'

  Detect:
    type: object
    additionalProperties: false
    properties:
      source_state:
        type: boolean
        description: 'D1 — a wiki-sync `source_state` hash marker counts as "summary exists".'
      provenance_ref:
        $ref: '#/$defs/ProvenanceRef'
      mirror:
        $ref: '#/$defs/Mirror'

  ProvenanceRef:
    type: object
    additionalProperties: false
    properties:
      enabled: {type: boolean}
      fields:
        type: array
        items: {type: string}
        description: 'frontmatter keys checked (string or list value), e.g. [source, sources].'
      match:
        type: string
        enum: [vault-rel-path, basename]
        description: >
          How a summary's cited `file:` is matched to a raw source (TASK 019/025).
          `vault-rel-path` (default): exact full-path equality — strict, only matches
          summaries that cite the raw by its vault-relative path. `basename`: basenames
          BOTH the cited value AND the raw target, so it matches summaries citing by
          basename OR by full path — preferred when source basenames are globally unique
          (e.g. YouTube-id transcripts) or an existing corpus already cites by basename;
          its only failure mode is two distinct raws sharing a basename across folders.
          The default is NOT basename (a default flip could merge such same-basename raws).

  Mirror:
    type: object
    additionalProperties: false
    properties:
      enabled: {type: boolean}
      raw_dirs:
        type: array
        items: {type: string}
        description: 'dir names that anchor a raw tree (e.g. _raw, _transcripts, Transcripts).'
      summary_dir:
        type: string
        description: 'sibling dir holding summaries; "." = the raw file''s own folder.'
      summary_ext: {type: string}
        # NOTE (TASK 021): single-valued — the mirror sees ONE summary extension. A
        # date that has only a `.docx` summary (no `.md`) is invisible to D2b; rely on
        # D2a provenance (`sources:`) for non-`.md` summaries.
      match:
        type: string
        enum: [stem-relpath, group-key]
      group_key:
        type: string
        description: 'shorthand regex applied to BOTH sides (default `^(\d+)`); superseded by `key`.'
        # NOTE (TASK 021): the default `^(\d+)` + leading-zero normalisation define a
        # leading-zero-INSENSITIVE numeric equivalence class (`01`/`1`/`001` → key `1`;
        # `10-1` → `10`). For multi-component lessons use a delimited/`template` key
        # (e.g. `^(\d+)-` or named groups) so distinct lessons do not collapse onto one
        # key. A new raw sharing an already-summarised key is SKIPPED + a merge/split WARN
        # (HIGH-1 / Option A) — resolve via `--force` (merge) or a finer key (split).
      key:
        $ref: '#/$defs/MirrorKey'

  MirrorKey:
    type: object
    additionalProperties: false
    properties:
      raw_regex: {type: string}
      summary_regex: {type: string}
      template:
        type: string
        description: 'string.Template over named groups → the comparable key (e.g. ${module}-${lesson}).'
      flags:
        type: array
        items: {type: string, enum: [ignorecase, unicode]}

# Top-level: library of $defs (mirrors layout-config.schema.yaml). The loader
# validates a merged config against #/$defs/SyncConfig explicitly.
type: object
description: 'Library of $defs. Validate against #/$defs/SyncConfig.'
