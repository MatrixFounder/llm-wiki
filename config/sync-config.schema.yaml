$schema: 'https://json-schema.org/draft/2020-12/schema'
$id: 'https://github.com/sergey/obsidian-llm-wiki/config/sync-config.schema.yaml'
title: 'sync-config'
description: >
  JSON Schema 2020-12 for the per-vault `.wiki/sync.yaml` (TASK 018 / R-11). This
  configures `wiki-sync` — the format-aware, tag-routed ingest dispatcher — and is
  a SEPARATE config system from both the per-vault identity config
  (config/wiki-config.schema.yaml) and the per-layout grammar
  (config/layout-config.schema.yaml). The file is OPTIONAL: a vault with no
  `.wiki/sync.yaml` uses the built-in defaults (empty zones/exclude, `wiki`
  namespace, built-in extension routing in scripts/wiki_skills/_sync.py).

  STRICT (additionalProperties: false everywhere) so a misspelled key is a
  load-time error (INVALID_SYNC_CONFIG, exit 6) rather than a silent no-op —
  same posture as layout-config.schema.yaml. The error NEVER echoes the offending
  value (CWE-209/CWE-117). Defense-in-depth against an untrusted config file is
  enforced in the loader (scripts/wiki_index/sync_config.py): a 256 KiB size cap
  before read + a SafeLoader subclass that REFUSES YAML anchors/aliases
  (`yaml.safe_load` alone still EXPANDS aliases → billion-laughs DoS; SEC-N3).

$defs:
  # ----------------------------------------------------------------------------
  # Extensions — optional operator overrides that EXTEND the built-in routing
  # sets (they never shrink them). `convert` → office/PDF convert+ingest; `text`
  # → raw text-source ingest; `skip` → force-skip an extension.
  # ----------------------------------------------------------------------------
  Extensions:
    type: object
    additionalProperties: false
    properties:
      convert:
        type: array
        items: {type: string}
        default: []
      text:
        type: array
        items: {type: string}
        default: []
      skip:
        type: array
        items: {type: string}
        default: []

  # ----------------------------------------------------------------------------
  # SyncConfig — the merged config the dispatcher consumes.
  #
  # `x-wiki-scope` (TASK 058, annotation-only — instance validation is unaffected):
  # the per-key consumption scope, previously implicit in resolver code.
  #   * `root-only`  — consumed ONLY from `<vault_root>/.wiki/sync.yaml`
  #                    (`load_sync_config`); silently ignored in a subfolder file
  #                    (wiki-config surfaces that as NON_CASCADING_KEY_IN_SUBFOLDER).
  #   * `cascading`  — per-folder Option-A cascade: every ancestor's RAW block is
  #                    deep-merged deepest-wins (`_resummarize.resolve_policy` /
  #                    `resolve_summarize`).
  # `x-wiki-format` marks strings needing special validation/UI (regex → ReDoS
  # gate + live tester; glob → liveness check; path → safe-subpath check).
  # wiki-config's UI model is generated from these annotations at runtime, so a
  # new key added here surfaces in the form/report with zero interface-code edits.
  # ----------------------------------------------------------------------------
  SyncConfig:
    type: object
    additionalProperties: false
    properties:
      zones:
        type: array
        items: {type: string}
        default: []
        x-wiki-scope: root-only
        x-wiki-format: glob
        description: >
          ADVISORY — not enforced. Vault-root-relative globs that DOCUMENT the sync
          zones; nothing reads them at runtime (`wiki-sync scan <zone>` takes an
          explicit zone argument, and the walk is scoped by `exclude:` alone).
      exclude:
        type: array
        items: {type: string}
        default: []
        x-wiki-scope: root-only
        x-wiki-format: glob
        description: >
          Vault-root-relative globs pruned from the walk. A NON-`.md` match is
          pruned immediately; a `.md` match is still read so a `#wiki/keep` tag
          can rescue it (precedence pinned in the loader).
      tag_namespace:
        type: string
        default: 'wiki'
        x-wiki-scope: root-only
        description: 'Routing-tag namespace; `#<ns>/{raw,skip,keep}` + a `<ns>:` frontmatter field.'
      extensions:
        $ref: '#/$defs/Extensions'
        x-wiki-scope: root-only
      resummarize:
        $ref: '#/$defs/Resummarize'
        x-wiki-scope: cascading
      transcript_dedup:
        $ref: '#/$defs/TranscriptDedup'
        x-wiki-scope: root-only
      summarize:
        $ref: '#/$defs/Summarize'
        x-wiki-scope: cascading
      extract_decisions:
        $ref: '#/$defs/ExtractDecisions'
        x-wiki-scope: cascading

  # ----------------------------------------------------------------------------
  # ExtractDecisions (TASK 063 / RFC-004) — the typed-knowledge extraction rail's
  # per-folder policy: WHETHER a zone auto-dispatches `wiki-extract-decisions`
  # after a summary is filed, and WHERE the extracted typed pages are written.
  #
  # It lives HERE (the sync schema) and not in `layouts/*.yaml` for one concrete
  # reason: `wiki-config`'s `set`/`unset` AND its web editor render ONLY from this
  # file (`_uimodel.py`, `_server.py`). A folder-name knob in the layout grammar
  # would be invisible in the config editor — so the operator could not edit it,
  # which was the whole requirement. Cascading (Option-A deep-merge, deepest-wins)
  # like `summarize:`, so a zone inherits its parent's dirs and overrides one key.
  #
  # STRICT (additionalProperties: false) at BOTH levels — a misspelled class name
  # (`dirs: {desicion: ...}`) is INVALID_SYNC_CONFIG (exit 6), never a silent
  # no-op that files pages into a default folder the operator did not choose.
  # ----------------------------------------------------------------------------
  ExtractDecisionsDirs:
    type: object
    additionalProperties: false
    properties:
      decision:
        type: string
        minLength: 1
        x-wiki-format: path
        description: >
          Folder for extracted `decision` pages, relative to the source note's own
          folder (default `decisions`). It must be a folder the LAYOUT'S READ GLOBS
          can see — `wiki-config validate` refuses a name the walker would skip,
          because a page the walker cannot see is a page the index does not have
          (G4). Cyrillic/spaces are fine; `..`, a leading `/` and backslashes are not.
          EMPTY IS REFUSED: `""` would file typed pages into the source note's own
          folder — the flat clutter the per-class folders exist to prevent.
      requirement:
        type: string
        minLength: 1
        x-wiki-format: path
        description: 'Folder for extracted `requirement` pages (default `requirements`). Same G4 coverage gate + non-empty rule as `decision`.'
      risk:
        type: string
        minLength: 1
        x-wiki-format: path
        description: 'Folder for extracted `risk` pages (default `risks`). Same G4 coverage gate + non-empty rule as `decision`.'

  ExtractDecisions:
    type: object
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        description: >
          Auto-dispatch the `wiki-extract-decisions` rail after a summary is filed
          (default false). `wiki-sync`/`wiki-import` emit a DISPATCH MARKER in their
          JSON envelope; the ORCHESTRATOR runs the rail — the CLIs never call an LLM
          (Decision-17). ⚠️ REQUIRES that rail (TASK 063): until it ships this key is
          INERT — the marker is emitted and nothing consumes it.
      dirs:
        $ref: '#/$defs/ExtractDecisionsDirs'

  # ----------------------------------------------------------------------------
  # Summarize (TASK 046 P3) — per-zone distil knobs that wiki-sync passes to the
  # delegated `wiki-import` (the converged construct path). OPT-IN + per-folder
  # overridable (cascade deep-merge, deepest-wins, like Resummarize): absence ≡ the
  # P2 defaults (profile auto / no diagrams / concepts ON / no subdir). `profile`
  # resolves to the wiki-import `--kind` (meeting/lesson → pyramid grammar; article →
  # article wrapper; auto → wiki-import auto-detects). STRICT (additionalProperties:
  # false) — a misspelled key is INVALID_SYNC_CONFIG (exit 6, value never echoed).
  # ----------------------------------------------------------------------------
  Summarize:
    type: object
    additionalProperties: false
    properties:
      profile:
        type: string
        enum: [auto, meeting, lesson, article]
        description: >
          Distil profile → wiki-import `--kind`. `auto` (default): wiki-import prepare
          auto-detects the content-type. `meeting`/`lesson`: pyramid grammar
          (meeting-summary / lesson-summary). `article`: the article wrapper.
      diagrams:
        type: boolean
        description: 'Pass `--diagrams` (selective-mermaid overlay) to wiki-import. Default false.'
      extract_concepts:
        type: boolean
        description: 'File concept pages (default true). false → `--no-concepts` (defer to /wiki-extract-concepts).'
      target_subdir:
        type: string
        x-wiki-format: path
        description: 'Optional subfolder under the topic folder where the summary note files (e.g. "_summary"). Default "" (the topic folder itself).'

  # ----------------------------------------------------------------------------
  # TranscriptDedup (TASK 023) — transcript FORMAT dedup. OPT-IN: absence ≡ no
  # dedup. Among transcript-format files (suffix in `prefer_ext`) sharing a
  # (parent-dir, identity) group, only the highest-preference format is ingested;
  # lower-preference siblings → `skip:transcript-variant:<kept_ext>`. A lone
  # caption with no higher-preference sibling is KEPT (still ingested).
  # STRICT (additionalProperties:false) — a misspelled key is INVALID_SYNC_CONFIG.
  # ----------------------------------------------------------------------------
  TranscriptDedup:
    type: object
    additionalProperties: false
    properties:
      enabled: {type: boolean}
      prefer_ext:
        type: array
        items: {type: string, pattern: '^\.[A-Za-z0-9.]+$'}
        description: 'Ordered format preference, most-preferred first (default [.txt, .vtt, .srt]).'
      identity:
        type: string
        enum: [stem, before-first-dot]
        description: >
          Variant-grouping key: 'stem' (filename minus last extension — groups a
          .vtt with its same-stem .txt) or 'before-first-dot' (filename up to the
          first '.', for YouTube-id captions like ID.ru.txt / ID.ru-orig.vtt).

  # ----------------------------------------------------------------------------
  # Resummarize (TASK 019) — the re-summarization policy gate. OPT-IN: absence ≡
  # TASK 018 behavior. A raw source (ingest / convert+ingest) is gated to
  # `skip:summary-exists:*` unless `--force` or `mode: always`. "Summary exists"
  # = union of D1 (source_state) ∪ D2a (provenance_ref) ∪ D2b (mirror). TASK 051
  # (R-18) adds `if-changed`: skip (`skip:summary-unchanged`) ONLY when the recorded
  # D1 `source_state` hash still equals the file — a *changed* source re-summarises
  # (the freshness mode for connector zones). Per-folder overridable via
  # `<folder>/.wiki/sync.yaml` (Option A cascade, deepest-wins). STRICT
  # (additionalProperties:false) — a misspelled key is INVALID_SYNC_CONFIG.
  # ----------------------------------------------------------------------------
  Resummarize:
    type: object
    additionalProperties: false
    properties:
      mode:
        type: string
        enum: [if-missing, if-changed, always, never]
        description: 'if-missing (default): ingest only if no summary detected; if-changed: re-summarise iff the recorded source_state hash no longer matches the file (TASK 051); always; never.'
      detect:
        $ref: '#/$defs/Detect'

  Detect:
    type: object
    additionalProperties: false
    properties:
      source_state:
        type: boolean
        description: 'D1 — a wiki-sync `source_state` hash marker counts as "summary exists".'
      provenance_ref:
        $ref: '#/$defs/ProvenanceRef'
      mirror:
        $ref: '#/$defs/Mirror'

  ProvenanceRef:
    type: object
    additionalProperties: false
    properties:
      enabled: {type: boolean}
      fields:
        type: array
        items: {type: string}
        description: 'frontmatter keys checked (string or list value), e.g. [source, sources].'
      match:
        type: string
        enum: [vault-rel-path, basename]
        description: >
          How a summary's cited `file:` is matched to a raw source (TASK 019/025).
          `vault-rel-path` (default): exact full-path equality — strict, only matches
          summaries that cite the raw by its vault-relative path. `basename`: basenames
          BOTH the cited value AND the raw target, so it matches summaries citing by
          basename OR by full path — preferred when source basenames are globally unique
          (e.g. YouTube-id transcripts) or an existing corpus already cites by basename;
          its only failure mode is two distinct raws sharing a basename across folders.
          The default is NOT basename (a default flip could merge such same-basename raws).

  Mirror:
    type: object
    additionalProperties: false
    properties:
      enabled: {type: boolean}
      raw_dirs:
        type: array
        items: {type: string}
        description: 'dir names that anchor a raw tree (e.g. _raw, _transcripts, Transcripts).'
      summary_dir:
        type: string
        description: 'sibling dir holding summaries; "." = the raw file''s own folder.'
      summary_ext: {type: string}
        # NOTE (TASK 021): single-valued — the mirror sees ONE summary extension. A
        # date that has only a `.docx` summary (no `.md`) is invisible to D2b; rely on
        # D2a provenance (`sources:`) for non-`.md` summaries.
      match:
        type: string
        enum: [stem-relpath, group-key]
      group_key:
        type: string
        x-wiki-format: regex
        description: 'shorthand regex applied to BOTH sides (default `^(\d+)`); superseded by `key`.'
        # NOTE (TASK 021): the default `^(\d+)` + leading-zero normalisation define a
        # leading-zero-INSENSITIVE numeric equivalence class (`01`/`1`/`001` → key `1`;
        # `10-1` → `10`). For multi-component lessons use a delimited/`template` key
        # (e.g. `^(\d+)-` or named groups) so distinct lessons do not collapse onto one
        # key. A new raw sharing an already-summarised key is SKIPPED + a merge/split WARN
        # (HIGH-1 / Option A) — resolve via `--force` (merge) or a finer key (split).
      key:
        $ref: '#/$defs/MirrorKey'

  MirrorKey:
    type: object
    additionalProperties: false
    properties:
      raw_regex: {type: string, x-wiki-format: regex}
      summary_regex: {type: string, x-wiki-format: regex}
      template:
        type: string
        description: 'string.Template over named groups → the comparable key (e.g. ${module}-${lesson}).'
      flags:
        type: array
        items: {type: string, enum: [ignorecase, unicode]}

# Top-level: library of $defs (mirrors layout-config.schema.yaml). The loader
# validates a merged config against #/$defs/SyncConfig explicitly.
type: object
description: 'Library of $defs. Validate against #/$defs/SyncConfig.'
