$schema: 'https://json-schema.org/draft/2020-12/schema'
$id: 'https://github.com/sergey/obsidian-llm-wiki/config/wiki-config.schema.yaml'
title: 'wiki-config'
description: >
  JSON Schema 2020-12 for the LLM Wiki MVP `wiki:` configuration. Two
  top-level definitions: WikiRootConfig (the root CLAUDE.md::wiki: block —
  requires vault_id per ADR-002 §D1.1) and WikiProjectOverride (per-project
  .wiki.yaml — all fields optional, no vault_id allowed at this scope).

  additionalProperties is permissive (true) for forward-compat with the optional
  extension blocks (transcript, light_summary). (The originally-planned `wiki-ingest`
  config block was retired in TASK 047 — transcript ingestion converged into `wiki-import`;
  the transcript/light_summary stubs are kept for config back-compat, exercised by
  `tests/fixtures/configs/valid-root-config.yaml`.)

$defs:
  # ----------------------------------------------------------------------------
  # VaultId — letter-start kebab-case, length 3-32, no double/trailing hyphens.
  # MUST round-trip with SQLite CHECK constraint in sql/wiki-index-v2.sql vaults
  # table (M-1 architectural review fix).
  # ----------------------------------------------------------------------------
  VaultId:
    type: string
    description: >
      Stable vault identity. REQUIRED explicit in WIKI_SCHEMA.md::vault_id
      (ADR-002 §D1.1 — no hash fallback). Pattern matches SQLite CHECK exactly.
      The '_global_' sentinel is reserved for cross-vault batch_runs (M-7).
    oneOf:
      - const: '_global_'
        description: 'Sentinel for cross-vault operations. Auto-created by wiki-init.'
      - allOf:
          - type: string
            pattern: '^[a-z][a-z0-9-]{1,30}[a-z0-9]$'
            description: 'letter-start, kebab-case, alphanumeric end'
          - not:
              pattern: '--'
            description: 'no double hyphens'
          - minLength: 3
          - maxLength: 32

  # ----------------------------------------------------------------------------
  # Layout — single-tier vs multi-course (promotion-spec).
  # ----------------------------------------------------------------------------
  Layout:
    type: string
    enum:
      - flat
      - per-project
      - karpathy
      - dev-project
      - obsidian-personal
    description: >
      Names the vault's layout GRAMMAR (TASK 012 / R-X1). The engine resolves
      this to a built-in layouts/<name>.yaml via scripts/wiki_index/layout_config.py.
      'flat' and 'per-project' are LEGACY ALIASES → 'karpathy' (the layout field
      never gated the two-tier walk). 'karpathy' — two-tier Karpathy vault
      (_sources/_concepts/_entities/_queries/_verifications + Lessons/<Course>/).
      'dev-project' — a software project's docs/ (TASK/PLAN/ADR/reviews/issues).
      'obsidian-personal' — a personal Obsidian vault (numbered folders, system
      dirs, MOC pattern, multilingual, deep hierarchy). Set on wiki-init; cannot
      change without reindex.

  # ----------------------------------------------------------------------------
  # Paths — vault-internal directory conventions.
  # ----------------------------------------------------------------------------
  Paths:
    type: object
    properties:
      sources:
        type: string
        default: '_sources/'
      concepts:
        type: string
        default: '_concepts/'
      entities:
        type: string
        default: '_entities/'
      raw:
        type: string
        default: '_raw/'
      vault_index:
        type: string
        default: '00-Vault-Index/'
    additionalProperties: true

  # ----------------------------------------------------------------------------
  # Lint — required frontmatter discipline (per layout).
  # ----------------------------------------------------------------------------
  Lint:
    type: object
    properties:
      required_frontmatter:
        type: array
        items:
          type: string
        description: >
          Frontmatter fields that EVERY page must declare. For 'flat' layout
          typically [type, title, date, tags]; for 'per-project' add 'project'.
    additionalProperties: true

  # ----------------------------------------------------------------------------
  # TranscriptConfig — optional `transcript:` tuning stub. (The original
  # "wiki-source-transcript wraps wiki-ingest" design was superseded: transcript
  # ingestion is handled by `wiki-import` → transcript-fetcher, TASK 044/046.
  # Kept for config back-compat; a fixture validates against it.)
  # ----------------------------------------------------------------------------
  TranscriptConfig:
    type: object
    properties:
      model:
        type: string
        default: 'claude-sonnet-4-6'
      timeout_seconds:
        type: integer
        minimum: 60
        maximum: 3600
        default: 600
    additionalProperties: true

  # ----------------------------------------------------------------------------
  # LightSummaryConfig — Phase 3b (R-24 wiki-light-summary).
  # ----------------------------------------------------------------------------
  LightSummaryConfig:
    type: object
    properties:
      model:
        type: string
        default: 'claude-haiku-4-5'
    additionalProperties: true

  # ----------------------------------------------------------------------------
  # PolicyConfig — TASK 049 (ADR-009): the optional retrieval-scope policy
  # ladder. STRICT (additionalProperties: false) — a misspelled key must fail,
  # not silently no-op. This schema is defense-in-depth: the authoritative
  # validation (incl. membership + duplicate checks) lives in
  # scripts/wiki_index/policy.py::parse_policy_block, because load_root_config
  # alone does not schema-validate.
  # ----------------------------------------------------------------------------
  PolicyConfig:
    type: object
    description: >
      TASK 049 — ordered classification ladder for policy-before-model
      retrieval scoping. `levels` low→high; `default_level` is assumed for
      pages with no `classification:` key (defaults to the lowest);
      `default_audience`, WHEN DECLARED, activates the layer for every scoped
      CLI without a flag (Q-049-1 — declaring it re-keys existing filed-query
      hashes once). Absent block + no --audience flag = the layer is OFF.
    required:
      - levels
    properties:
      levels:
        type: array
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,15}$'
      default_level:
        type: string
        pattern: '^[a-z][a-z0-9_-]{0,15}$'
      default_audience:
        type: string
        pattern: '^[a-z][a-z0-9_-]{0,15}$'
    additionalProperties: false

  # ----------------------------------------------------------------------------
  # WikiRootConfig — root CLAUDE.md::wiki: block.
  # vault_id is REQUIRED (ADR-002 §D1.1 fail-fast — no hash fallback).
  # ----------------------------------------------------------------------------
  WikiRootConfig:
    type: object
    description: >
      Root-level wiki configuration. Lives in CLAUDE.md as a YAML block under
      the 'wiki:' key. Read by config_loader.load_config(cwd) on every skill
      invocation.
    required:
      - vault_id
      - language
      - layout
      - paths
    properties:
      vault_id:
        $ref: '#/$defs/VaultId'
      language:
        type: string
        enum: [ru, en, es, fr, de, it, pt, mixed]
        description: 'Primary content language (for FTS5 tokenizer locale hint).'
      layout:
        $ref: '#/$defs/Layout'
      paths:
        $ref: '#/$defs/Paths'
      lint:
        $ref: '#/$defs/Lint'
      transcript:
        $ref: '#/$defs/TranscriptConfig'
      light_summary:
        $ref: '#/$defs/LightSummaryConfig'
      index_db:
        type: string
        minLength: 1
        description: >
          TASK 022 — optional per-vault index DB location (read from raw
          WIKI_SCHEMA.md frontmatter only). Relative → contained under vault_root;
          absolute/~ → explicit operator escape (cloud vaults). Path semantics are
          validated in config_loader.resolve_index_db_path, NOT here (this is DiD).
      policy:
        $ref: '#/$defs/PolicyConfig'
    additionalProperties: true

  # ----------------------------------------------------------------------------
  # WikiProjectOverride — .wiki.yaml at any subdirectory.
  # All fields optional; merged onto WikiRootConfig via deep-merge in
  # config_loader (task-001-13). vault_id NOT allowed at this scope (vault
  # identity belongs to the root).
  # ----------------------------------------------------------------------------
  WikiProjectOverride:
    type: object
    description: >
      Per-project (course-level) override layered on top of WikiRootConfig.
      Lives in <vault>/Lessons/<Course>/.wiki.yaml or any subdir.
    properties:
      language:
        type: string
        enum: [ru, en, es, fr, de, it, pt, mixed]
      paths:
        $ref: '#/$defs/Paths'
      lint:
        $ref: '#/$defs/Lint'
      transcript:
        $ref: '#/$defs/TranscriptConfig'
      light_summary:
        $ref: '#/$defs/LightSummaryConfig'
    # vault_id is intentionally NOT listed in properties; presence at this
    # scope is a configuration error (caught in task-001-13 config_loader).
    # index_db (TASK 022) is identity too → also banned here. policy (TASK 049)
    # is likewise banned — a subdir override must never weaken (or fork) the
    # vault's classification ladder. The single
    # `not: required: [vault_id, index_db]` would only reject having BOTH, so each
    # ban is its own `not` under allOf.
    allOf:
      - not:
          required:
            - vault_id
      - not:
          required:
            - index_db
      - not:
          required:
            - policy
    additionalProperties: true

# Top-level: this document is a *library of definitions*, not a directly-
# validatable schema. config_loader (task-001-13) picks the appropriate $defs
# entry based on file scope:
#   CLAUDE.md::wiki:  → validate against #/$defs/WikiRootConfig
#   <subdir>/.wiki.yaml → validate against #/$defs/WikiProjectOverride
#
# Tests construct per-scope validators via:
#   Draft202012Validator({**schema, "$ref": "#/$defs/WikiRootConfig"})
#
# Rationale: a top-level `oneOf` would silently accept root configs missing
# vault_id by routing them to WikiProjectOverride (which forbids vault_id but
# requires nothing). Scope must be resolved by the caller, not the schema.
type: object
description: 'Library of $defs. Use $ref to validate against a specific scope.'
