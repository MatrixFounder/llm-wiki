[mypy]
# Project-wide mypy configuration. Strict mode is the default contract for
# `scripts/wiki_skills/` and `scripts/wiki_index/` (Phase 3a invariant).
strict = True
python_version = 3.14
show_error_codes = True

# --- Vendored wiki_ingest package overrides ---------------------------- #
# The vendored `scripts/wiki_ingest/` package is a SNAPSHOT of upstream
# (Universal-skills/skills/wiki-ingest/) per Decision-12. Upstream code
# was not authored under `mypy --strict` and surfaces ~190 typing errors
# across 21 files (TASK 004 bead 004-04 initial scan).
#
# Per the bead's time-box rule (Decision-14 + task-reviewer nit):
# "if cumulative type-fixup time exceeds 2 hours, switch from fix-locally
# to # type: ignore wholesale". A package-level `ignore_errors = True`
# is the documented escape hatch — equivalent to 190 per-error
# `# type: ignore[...]` markers but landed as one config entry instead
# of polluting upstream code.
#
# Resolution path: upstream issue TBD ("Type annotation gaps surface
# under mypy --strict in vendored consumers"). When upstream goes
# mypy-strict-clean, remove this override + re-sync. Until then,
# vendored code is trusted-by-snapshot, not by typecheck.
#
# Note: this does NOT affect `scripts/wiki_skills/wiki_enrich.py` when
# it imports from the vendored package — wiki-enrich's own annotations
# are still strict-checked; calls into `vendored_ingest()` are typed via
# the function signature exposed in the IngestError-bearing public API
# (bead 004-03).
[mypy-scripts.wiki_ingest.*]
ignore_errors = True
