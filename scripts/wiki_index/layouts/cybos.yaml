# Built-in CYBOS layout — an "operational memory" / event-graph vault (TASK 031 /
# R-031-1/2). A typed-knowledge vault: Decisions, Requirements, Risks, Incidents,
# Hypotheses, Facts, Events + the engineering spine (Tasks, ADRs, Plans) + the
# TASK-034 agent-memory classes (Agents, Tools, Workflows, Capabilities, Executions,
# Patterns). Every raw type tag-routes onto the existing pages.type CHECK enum — its
# CLASSIFICATION is ZERO-DDL. The event-graph RELATION layer (typed edges
# implements/supersedes/caused-by/relates-to + the TASK-034 invalidated-by/activated-by/
# uses/owns) SHIPPED in TASK 032/034 (ADR-004; schema v7) — the edge keys in
# templates/page-types/* are LIVE (authored forward, inverse auto-derived). Temporal
# queries ("what was active on date X") use `wiki-search --as-of` (TASK 034) over the
# `date` + supersede/invalidate graph — no per-note `valid_to` authoring required.
#
# vault_root = the vault directory holding the typed folders (decisions/, incidents/, …).
# Opt-in: `wiki-init --scaffold-new --layout cybos` (init_scaffold: none → no Karpathy
# two-tier tree). Per-project tweaks via <vault>/.wiki/layout.yaml (type_mapping UNIONs).
schema_version: '2.0'
layout: cybos

# Existing-tree layout — index a real vault; do NOT scaffold a Karpathy two-tier tree.
init_scaffold: none

ignore:
  - ".git/**"
  - ".obsidian/**"                  # Obsidian app state — not knowledge
  - ".wiki/**"                      # operational state (db / render-state) — Class C
  - "**/.DS_Store"
  - "**/__pycache__/**"
  - "**/_raw/**"                    # un-summarised raw captures (any depth, incl. <folder>/_raw) stay out of the index
  - ".staging/**"
file_extensions: ['.md']
slug_strategy: transliterate        # cross-platform-safe ASCII slugs

# TASK 040 / ADR-007 — write-side grammar (where NEW pages file). Karpathy nests sources in _sources/ (filename==slug); PARA files in the target folder (human title).
write:
  source_subdir: ""
  source_filename: "title"


# Globs evaluated in order, first-match-wins (relative to vault_root). Flat vault →
# project '_vault_'. One folder per knowledge class + the engineering spine.
paths:
  - {glob: "decisions/**/*.md",    type: decision,    project: "_vault_"}
  - {glob: "requirements/**/*.md", type: requirement, project: "_vault_"}
  - {glob: "risks/**/*.md",        type: risk,        project: "_vault_"}
  - {glob: "incidents/**/*.md",    type: incident,    project: "_vault_"}
  - {glob: "hypotheses/**/*.md",   type: hypothesis,  project: "_vault_"}
  - {glob: "facts/**/*.md",        type: fact,        project: "_vault_"}
  - {glob: "events/**/*.md",       type: event,       project: "_vault_"}
  - {glob: "tasks/**/*.md",        type: task,        project: "_vault_"}
  - {glob: "adr/**/*.md",          type: adr,         project: "_vault_"}
  - {glob: "plans/**/*.md",        type: plan,        project: "_vault_"}
  # --- TASK 034: agent-memory classes (RFC-002/003/005/006 classification) ---
  - {glob: "agents/**/*.md",       type: agent,       project: "_vault_"}
  - {glob: "tools/**/*.md",        type: tool,        project: "_vault_"}
  - {glob: "workflows/**/*.md",    type: workflow,    project: "_vault_"}
  - {glob: "capabilities/**/*.md", type: capability,  project: "_vault_"}
  - {glob: "executions/**/*.md",   type: execution,   project: "_vault_"}
  - {glob: "patterns/**/*.md",     type: pattern,     project: "_vault_"}
  # --- TASK 072 / bead 072-10b: THE IMPORTED-SOURCE HOME (the missing conjunct) ---
  # `type_mapping` below declares `summary` / `article-summary` / `meeting-summary` /
  # `lesson-summary` (TASK 046) and the 6 concept/entity classes — but until this glob
  # NO path could see an imported note. Measured, not eyeballed: the only walker-visible
  # folders were the 18 typed-knowledge class dirs, so `wiki-import --folder Articles`
  # wrote a well-formed note that `wiki-reindex --full` never indexed — and `skipped[]`
  # stayed EMPTY, because that channel only reports files the walker DID see. Half a
  # feature: the layout mapped the class, its read globs could not see the write dir
  # (the TASK-063 conjunction trap, live on `main`).
  #
  # `**` also covers the sibling `<folder>/_concepts/` pages the construct path files,
  # which carry the same 6 orphaned classes — one glob closes both halves. `type:
  # summary` is only the fallback for an untyped capture: a note's own frontmatter
  # `type:` WINS (normalization.py PW-C/F precedence), so an `article-summary` filed
  # here still indexes as `article-summary`.
  - {glob: "sources/**/*.md",      type: summary,      project: "_vault_"}
  # --- DF-049-1: the RAG write surfaces. `wiki-query apply` / `wiki-verify-multi
  # apply` file to <root>/_queries/ + <root>/_verifications/ on EVERY layout (the
  # karpathy constants), and self-index with project `_vault_` (derive_slug).
  # Without these globs the walk never sees the filed page and the next reindex
  # PRUNES its row (the filed answer stops being retrievable; a TASK-049
  # classification-leak finding over it vanishes). type comes from the page's own
  # frontmatter (`type: query|verification` — always stamped by apply);
  # path_type_fallback is the defensive net.
  - {glob: "_queries/**/*.md",       type: query,        project: "_vault_"}
  - {glob: "_verifications/**/*.md", type: verification, project: "_vault_"}

# Tag-route: each raw knowledge-class type → an existing db_type CHECK enum value + a
# filterable tag (db_type rationale: research = analysis/finding; brief = concise spec;
# concept = atomic definitional unit; summary = timestamped narrative record — ADR-003
# D1 / Q-031-2). Precise per-class CLI filtering = `wiki-search --tag <class>` (or
# `--where 'tags=<class>'`) — a list-membership match on the tags LIST via json_each
# (TASK 033 / Q-033). The `--types <db_type>` bucket + FTS tag word still work too.
type_mapping:
  # --- the 7 typed knowledge classes ---
  decision:    {db_type: research, tag: decision}     # a choice made, with rationale
  requirement: {db_type: brief,    tag: requirement}  # a spec/BRD requirement
  risk:        {db_type: research, tag: risk}          # an identified risk
  incident:    {db_type: research, tag: incident}      # an operational incident / postmortem
  hypothesis:  {db_type: research, tag: hypothesis}    # an unverified assumption to test
  fact:        {db_type: concept,  tag: fact}          # an atomic verifiable statement
  event:       {db_type: summary,  tag: event}         # a timestamped occurrence (meeting/release/milestone)
  # --- engineering spine (shared vocabulary with the dev-project layout) ---
  task:        {db_type: brief,    tag: task}
  adr:         {db_type: research, tag: adr}
  plan:        {db_type: brief,    tag: plan}
  # --- TASK 034 agent-memory classes (RFC-002/003/005/006) ---
  agent:       {db_type: concept,  tag: agent}        # an autonomous actor (LLM agent / human role)
  tool:        {db_type: concept,  tag: tool}         # a callable capability surface (CLI / API)
  workflow:    {db_type: brief,    tag: workflow}     # a procedure / state machine (RFC-005)
  capability:  {db_type: concept,  tag: capability}   # an atomic skill an agent can perform (e.g. ocr)
  execution:   {db_type: summary,  tag: execution}    # a timestamped run record (RFC-003 operational memory)
  pattern:     {db_type: research, tag: pattern}      # a consolidated second-order finding (RFC-006)
  # --- imported-source summaries (wiki-import construct path, ADR-007) ---
  # an external article/paper/thread/transcript filed as agent reference material.
  # Additive (zero-DDL); without these `wiki-import` is always-partial here.
  summary:         {db_type: summary, tag: null}      # generic imported-source summary
  article-summary: {db_type: summary, tag: article}
  meeting-summary: {db_type: summary, tag: meeting}
  lesson-summary:  {db_type: summary, tag: lesson}    # TASK 046: --kind lesson (else → generic summary)
  # wiki-import concept/entity pages (TASK 037 pattern, mirror obsidian-personal): the
  # construct path files `<folder>/_concepts/<slug>.md` with `type: concept` (or person/…).
  # These mappings let them INDEX (else `type: concept` → UnmappedTypeError → silently
  # dropped, breaking Class A/B rebuildability). ⚠️ CORRECTED 2026-08-07 (DF-072-7): this
  # comment used to claim "cybos's recursive per-folder globs DISCOVER them" full stop.
  # That was only ever true for a note already sitting inside a typed CLASS dir — for an
  # imported source note, which is the case the comment is about, NO glob reached the
  # `_concepts/` page until the `sources/**/*.md` glob above was added. Mapping a class
  # without a glob that can see its write dir is HALF a feature, and it fails silently.
  concept:  {db_type: concept, tag: null}
  external: {db_type: concept, tag: external}
  person:   {db_type: concept, tag: person}
  company:  {db_type: concept, tag: company}
  product:  {db_type: concept, tag: product}
  group:    {db_type: concept, tag: group}
  # DF-049-1: the filed RAG answer/verdict classes (mirror karpathy).
  query:        {db_type: query,        tag: null}
  verification: {db_type: verification, tag: null}

path_type_fallback: {}              # cybos types come from paths[].type

ref_extraction:
  - kind: wiki-link
    regex: '\[\[([^\]|]+)(?:\|[^\]]+)?\]\]'
    target_group: 1
  - kind: markdown-link
    regex: '\[([^\]]+)\]\(([^)]+\.md(?:#[^)]+)?)\)'
    target_group: 2
    transform: stem
  # id-ref: dev-project's IDs + the cybos typed-knowledge IDs (DEC/INC/RISK/REQ/HYP).
  - kind: id-ref
    regex: '\b(ADR-\d+|R-\d+(?:\.\d+)*|task-\d+(?:-\d+)*|DEC-\d+|INC-\d+|RISK-\d+|REQ-\d+|HYP-\d+)\b'
    target_group: 1

# Typed-knowledge notes often lack frontmatter (a quick capture) — title from first H1 ∥ stem.
frontmatter_synthesis:
  enabled: true
  title_source: first_h1
  fallback_title: filename_stem

# A rebuildable DECISIONS / INCIDENTS ledger (PW-H, like dev-project's KNOWN_ISSUES) is a
# candidate follow-on — omitted in Phase 1 to keep the bead tight (ADR-003 / plan 🟢-2).
auto_indexes: []

# --- TASK 036 / R-15: derived knowledge health (zero-DDL, read-only) ---
# Lifecycle-drift (Slice A1, surfaced by `wiki-lint`): a page whose AUTHORED `status`
# contradicts its event-graph state. `edge` is the STORED ref_type carried by the page
# (the auto-derived inverse — a decision authored `superseded_by:` OR superseded by
# another page's `supersedes:` both yield a `superseded-by` row ON the page). A NULL/
# absent status is NEVER drift (only an explicit contradiction). High-confidence
# contradictions only; hypothesis (state lives in prose) + risk (an open risk legitimately
# has a `caused_by`) are intentionally NOT included. Drift rides `wiki-lint` and gates only
# under `--strict`.
drift_rules:
  - {class: decision, edge: superseded-by,  expect_status: superseded}             # superseded but not marked so
  - {class: decision, edge: invalidated-by, forbid_status: [proposed, accepted]}   # voided by an incident, still live
  - {class: workflow, edge: superseded-by,  expect_status: superseded}             # replaced workflow version

# Coverage gaps (Slice A2, surfaced by `wiki-health coverage`): a page MISSING an expected
# relation. `requires_edge` = the page should carry this ref_type (gap if not); `requires_field`
# = the page should have a non-empty frontmatter scalar (gap if empty/absent). A gap is DATA,
# not a failure — `wiki-health` always exits 0 on success. Edge semantics from templates/page-types/*:
# requirement/capability are covered by an inbound `implements` (stored as `implemented-by`
# on the page); a fact's evidence is its `source:` scalar (NOT an edge).
#
# TASK 072 / P2 — a `requires_field` rule may also carry `forbid_values: [str]`, which
# widens its gap condition to "PRESENT, and a non-answer" (e.g. `verified_on: "не
# проверено"` — non-empty, so invisible to the absent/empty branch, which is how 20 live
# `hypothesis` pages read as covered). Reported as gap kind `field-value`.
#
# ⚠️ DELIBERATELY NOT DECLARED HERE, and this is not an oversight. The sentinel STRINGS
# are one operator's authoring convention (Russian, in that vault's case); shipping them
# in a built-in layout would impose them on every cybos vault. Their home is the
# operator's own override:
#
#     # <vault>/.wiki/layout.yaml   — NOTE: `coverage_rules` REPLACES this list entirely
#     coverage_rules:
#       - {class: requirement, requires_edge: implemented-by}
#       - {class: capability,  requires_edge: implemented-by}
#       - {class: fact,        requires_field: source}
#       - {class: hypothesis, requires_field: verified_on,
#          forbid_values: ["не проверено", "n/a", "-"]}
#
# `tests/test_coverage_forbid_values.py::test_no_builtin_layout_ships_forbid_values`
# enforces this over the glob-discovered layout population — a layout added tomorrow is
# covered without editing the test. See ADR-006 D-036-3a.
coverage_rules:
  - {class: requirement, requires_edge: implemented-by}   # nothing implements this requirement
  - {class: capability,  requires_edge: implemented-by}   # no agent/tool provides this capability
  - {class: fact,        requires_field: source}          # fact with no cited source

# --- TASK 054 / R-19: formal ontology contract (zero-DDL, read-only, NOT a write gate) ---
# Promotes the typed-knowledge ontology from tribal convention to a declared, validated,
# diffable contract an orchestrator can also be FED as context. Three parts:
#   closed_types: DECLARES the type roster is closed (== the type_mapping keys, no second
#     roster). Enforcement is at INDEX time, not re-swept read-side: reindex resolves a typed
#     page's class from its frontmatter `$.type` and SKIPS any page whose `$.type` ∉
#     type_mapping (reported in `wiki-reindex --full`'s `skipped[]`) — an out-of-roster type
#     is a hard classification failure, so it can never be indexed to flag later (Q-054).
#   edges: per-(forward)-ref_type domain→range. `from`/`to` are the SOURCE/TARGET page classes
#     ($.type). A page carrying the edge whose source class ∉ from = a `domain` violation; whose
#     RESOLVED target class ∉ to = a `range` violation (an orphan/entity target is skipped).
#   properties: lift the `status` vocabularies out of templates/page-types/*.md comments into
#     validated config — a PRESENT scalar $.<field> not in the enum is a violation.
# Load-gate (_validate_ontology): every edge ∈ the 15 event-graph ref_types; every from/to/class
# ∈ type_mapping keys; every field allow-listed — a typo is exit 6, never a silent never-fires
# rule. Edge/property violations surface as a `wiki-lint` `ontology-violation` (a soft
# CONTRADICTION → advisory, gates `--strict`, ADR-006 D-036-2) + `wiki-health ontology` (always
# exit 0). Reindex still indexes an edge/property-violating page (markdown canonical, ADR-002
# §D8) — reported, never enforced.
ontology:
  closed_types: true
  edges:
    # from/to = SOURCE/TARGET page classes ($.type), derived from the edge conventions the
    # templates/page-types/*.md author (forward `implements:`/`causes:`/… OR the inverse
    # `implemented_by:`/`caused_by:`/… that reindex auto-derives the forward from). Kept broad
    # enough to never false-flag a template-conformant note; test_templates_conform_to_ontology
    # anchors that (a cybos vault authored per the templates yields ZERO ontology violations).
    - {edge: implements,  from: [decision, task, agent, tool],                     to: [requirement, capability]}
    - {edge: supersedes,  from: [decision, requirement, workflow, adr, pattern],   to: [decision, requirement, workflow, adr, pattern]}
    - {edge: causes,      from: [decision, event, incident, risk],                 to: [incident, event, risk, pattern, execution]}
    - {edge: invalidates, from: [incident, event],                                 to: [decision, hypothesis]}
    - {edge: activates,   from: [event],                                           to: [decision]}
    - {edge: uses,        from: [agent, workflow, execution],                      to: [tool, capability]}
    - {edge: owns,        from: [agent],                                           to: [workflow, tool, capability]}
  properties:
    - {class: decision,    field: status, enum: [proposed, accepted, superseded, rejected]}
    - {class: incident,    field: status, enum: [open, mitigated, resolved]}
    - {class: requirement, field: status, enum: [draft, approved, implemented, dropped]}
    - {class: workflow,    field: status, enum: [draft, active, deprecated, superseded]}
    - {class: hypothesis,  field: status, enum: [proposed, testing, confirmed, refuted]}
    - {class: risk,        field: status, enum: [open, mitigated, accepted, closed]}
    - {class: tool,        field: status, enum: [active, deprecated, retired]}
    - {class: agent,       field: status, enum: [active, deprecated, retired]}
    - {class: capability,  field: status, enum: [active, deprecated]}
    - {class: execution,   field: status, enum: [success, failed, partial]}
    - {class: pattern,     field: status, enum: [active, superseded]}
