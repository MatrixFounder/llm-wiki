# Built-in OBSIDIAN-PERSONAL layout — a real personal Obsidian vault (TASK 012 /
# R-X2): numbered top-level folders, underscore system dirs, MOC pattern, deep
# hierarchy, multilingual filenames, .base files. Drives PW-J/K/L/M/N + PW-F.
schema_version: '2.0'
layout: obsidian-personal

ignore:
  - ".obsidian/**"                  # Obsidian metadata
  - ".trash/**"                     # Obsidian trash
  - "_templates/**"                 # not content
  - "**/*.base"                     # Obsidian Bases — not md (also via file_extensions)
  - "**/.DS_Store"
  # TASK 025 / R-4: keep raw/staging scratch markdown OUT of the search index — raw
  # imports and the convert staging area are NOT distilled knowledge. These match at
  # ANY depth (`**/`), which is INTENTIONALLY BROADER than (and distinct in purpose
  # from) wiki-sync's own walk: wiki-sync prunes only `_raw/.staging|.locks|failed`
  # and otherwise INGESTS top-level `_raw/` to distil it into summary notes — so the
  # reindex search index and the wiki-sync ingest walk deliberately disagree on `_raw`.
  # `_raw`/`.staging` are thus RESERVED scratch-dir names under this built-in layout (a
  # user folder literally named `_raw`/`.staging` at any depth is silently excluded;
  # `ignore` is UNION-only, so rename rather than try to subtract). `_transcripts` is
  # NOT ignored: it holds the distilled `.txt` wiki-sync ingests, already excluded by
  # `file_extensions: ['.md']`.
  - "**/_raw/**"                    # raw imports staged for ingest (not distilled)
  - "**/.staging/**"                # convert staging area
file_extensions: ['.md']
slug_strategy: preserve-unicode     # Cyrillic/CJK survive (single-OS workflows)

# TASK 040 / ADR-007 — write-side grammar (where NEW pages file). Karpathy nests sources in _sources/ (filename==slug); PARA files in the target folder (human title).
write:
  source_subdir: ""
  source_filename: "title"


# Order matters — most specific glob first; first-match-wins. project derived
# from the numbered-folder path via regex + ${name} template (no shell ternaries:
# the two-component vs single-component cases are separate entries).
paths:
  # --- Underscore system folders — explicit project per area --------------
  - {glob: "_daily/**/*.md",     type: daily-note, project: "_daily",     default_tags: [daily]}
  - {glob: "_clippings/**/*.md", type: clipping,   project: "_clippings", default_tags: [clipping]}
  - {glob: "_inbox/**/*.md",     type: note,       project: "_inbox",     default_tags: [inbox, draft]}
  # TASK 037: generated entity pages at the VAULT ROOT. A root-level (`*.md`) or
  # MOC (`NN - Area.md`) source note's `_concepts/` sibling lands at
  # `<root>/_concepts/` — which matches no numbered glob and would be silently
  # dropped at reindex. These rules are ROOT-ANCHORED (no leading `**`) on purpose:
  # a deeper `_concepts/` (under `NN - Area/Sub/`) already matches the 2-level glob
  # below with a domain-scoped project, and must keep it. `type` comes from the
  # page's own frontmatter (`type: concept`) → db_type concept via type_mapping.
  - {glob: "_concepts/**/*.md", project: "_concepts"}
  - {glob: "_entities/**/*.md", project: "_entities"}

  # --- Numbered top-level: "NN - Area/Sub/.../X.md" → project "Area/Sub" ---
  - glob: "[0-9][0-9] - */*/**/*.md"
    type: note
    project_pattern: '^(?P<num>\d+)\s*-\s*(?P<area>[^/]+)/(?P<sub>[^/]+)/'
    project_template: '${area}/${sub}'
  # --- Numbered top-level: "NN - Area/X.md" (no sub) → project "Area" ------
  - glob: "[0-9][0-9] - */*.md"
    type: note
    project_pattern: '^(?P<num>\d+)\s*-\s*(?P<area>[^/]+)/'
    project_template: '${area}'
  # --- The MOC note itself: "NN - Area.md" → project "Area", tag moc -------
  - glob: "[0-9][0-9] - *.md"
    type: note
    project_pattern: '^(?P<num>\d+)\s*-\s*(?P<area>[^.]+)\.md$'
    project_template: '${area}'
    extra_tags: [moc]
  # --- Standalone root-level notes (no folder, no number) -----------------
  - {glob: "*.md", type: note, project: "_root_"}

type_mapping:
  note:            {db_type: summary, tag: null}
  daily-note:      {db_type: summary, tag: daily}
  clipping:        {db_type: summary, tag: clipping}
  # AI/meeting/lesson summaries (summarizing-meetings / wiki-enrich output) +
  # conference MOC notes. WITHOUT these, a note carrying `type: lesson-summary`
  # (etc.) raises UnmappedTypeError and is SILENTLY dropped at reindex / flagged
  # skip:unmappable-type by wiki-sync — i.e. the compounding-knowledge loop is
  # dead for exactly the content this layout exists to capture (closes Q-019-9).
  summary:         {db_type: summary, tag: null}
  lesson-summary:  {db_type: summary, tag: lesson}
  meeting-summary: {db_type: summary, tag: meeting}
  webinar-summary: {db_type: summary, tag: webinar}
  moc:             {db_type: summary, tag: moc}
  # TASK 025 / R-3: the rest of the common summary family a real PARA vault captures.
  # All route to db_type: summary (a tag-only distinction) → additive, zero
  # re-classification. Closes the silent UnmappedTypeError-drop the 2026-06-09 dogfood
  # hit on `tutorial-summary`.
  tutorial-summary: {db_type: summary, tag: tutorial}
  article-summary:  {db_type: summary, tag: article}
  book-summary:     {db_type: summary, tag: book}
  video-summary:    {db_type: summary, tag: video}
  podcast-summary:  {db_type: summary, tag: podcast}
  course-summary:   {db_type: summary, tag: course}
  # TASK 037 / R-6: concept + entity classes (mirror karpathy) so the now
  # layout-aware `wiki-extract-concepts` can write `_concepts/<slug>.md` pages
  # INTO a PARA vault (a `<area>/<sub>/_concepts/` sibling of the source note)
  # and have them index as db_type concept — WITHOUT these a generated concept
  # page carries `type: concept`, hits UnmappedTypeError, and is silently
  # dropped at reindex (so the entity wikilinks would never resolve).
  concept:  {db_type: concept, tag: null}
  external: {db_type: concept, tag: external}
  person:   {db_type: concept, tag: person}
  company:  {db_type: concept, tag: company}
  product:  {db_type: concept, tag: product}
  group:    {db_type: concept, tag: group}

# TASK 037: a `_concepts/`/`_entities/` page that somehow lacks a `type:` infers
# its class from the dir name (defensive — generated pages always stamp
# `type: concept`, and the numbered-folder glob otherwise supplies `note`).
path_type_fallback:
  _concepts: concept
  _entities: external

# Most Obsidian notes have no frontmatter — title from first H1 ∥ filename stem.
frontmatter_synthesis:
  enabled: true
  title_source: first_h1
  fallback_title: filename_stem

ref_extraction:
  - kind: wiki-link
    regex: '\[\[([^\]|#]+)(?:#[^|\]]*)?(?:\|[^\]]+)?\]\]'
    target_group: 1
  - kind: markdown-link
    regex: '\[([^\]]+)\]\(([^)]+\.md(?:#[^)]+)?)\)'
    target_group: 2
    transform: stem

auto_indexes: []
