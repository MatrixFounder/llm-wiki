# Vendor → agent-instruction-file mapping for `wiki-init` scaffolding.
#
# `wiki-init` (scaffold-new AND register-existing) renders an agent-instructions
# file for the SELECTED vendor(s) so a vault is usable by the agent CLI launched
# at its root. Each file is rendered from `template` (a `string.Template` in
# templates/) substituting the vault's vault_id/language/layout/description, and
# written to `<vault>/<filename>` — NON-destructively (an existing file is never
# clobbered without `--force`).
#
# Selection (the `--vendor` flag): omit → `default_vendors` (CLAUDE.md only);
# `--vendor gemini` → GEMINI.md only; `--vendor claude,gemini` (or `--vendor all`)
# → both. By default exactly ONE file is written.
#
# All vendor filenames MUST also be in `scripts/wiki_index/layout.py`
# SYSTEM_FILES so the indexer (reindex) and `wiki-sync` skip them — they are
# operating instructions, not vault knowledge.
#
# For now Gemini reuses the Claude template VERBATIM (an exact copy). When
# vendor-specific guidance diverges, add a `GEMINI.md.tmpl` and point `gemini`
# at it — no other code change needed.

schema_version: "1.0"

# Vendor(s) written when --vendor is omitted (order = render order). Default:
# Claude Code only — one file. Set to e.g. [claude, gemini] to write both by default.
default_vendors: [claude]

vendors:
  claude:
    filename: CLAUDE.md        # Claude Code
    template: CLAUDE.md.tmpl
  gemini:
    filename: GEMINI.md        # Gemini CLI
    template: CLAUDE.md.tmpl   # exact copy of the Claude base for now
